<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>FLYTAU - הרשמה</title>
</head>
<body>
    <div class="container">
        <img src="{{ url_for('static', filename='flytau logo.png') }}" alt="FLYTAU Logo" class="logo">

        <h1>הרשמת לקוח חדש</h1>

        <form action="/register" method="POST">
            <input type="text" name="id" placeholder="תעודת זהות" required>
            <div style="display: flex; gap: 10px;">
                <input type="text" name="first_name" placeholder="שם פרטי" required>
                <input type="text" name="last_name" placeholder="שם משפחה" required>
            </div>
            <input type="email" name="email" placeholder="אימייל" required>
            <input type="password" name="password" placeholder="סיסמה" required>
            <input type="text" name="address" placeholder="כתובת מגורים" required>
            <input type="text" name="passport" placeholder="מספר דרכון" required>

            <label style="display: block; text-align: right; margin-top: 10px; font-size: 14px;">תאריך לידה:</label>
            <input type="date" name="birth_date" required>

            <button type="submit">הירשם עכשיו</button>
        </form>

        <p>כבר רשום? <a href="/">חזור להתחברות</a></p>
    </div>
</body>
</html>
